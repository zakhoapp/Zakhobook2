<!DOCTYPE html>
<html lang="ku" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دوویەمین پێشانگەها ناڤدەولەتی یا پەرتووکان ل زاخۆ</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Vazirmatn & Noto Kufi Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700;800;900&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            kurdish: ['Vazirmatn', 'Noto Kufi Arabic', 'sans-serif'],
            heading: ['Noto Kufi Arabic', 'Vazirmatn', 'sans-serif']
          },
          colors: {
            skybrand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              950: '#082f49'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Vazirmatn', 'Noto Kufi Arabic', sans-serif;
      background: radial-gradient(circle at top center, #e0f2fe 0%, #f0f9ff 40%, #eef6fc 100%);
      color: #0f172a;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient animated orbs */
    .sky-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(186, 230, 253, 0.7);
      box-shadow: 0 10px 30px -10px rgba(14, 165, 233, 0.12),
                  0 4px 6px -2px rgba(14, 165, 233, 0.05);
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .glass-card-button {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(186, 230, 253, 0.85);
      box-shadow: 0 8px 24px -6px rgba(14, 165, 233, 0.15),
                  0 2px 4px 0 rgba(14, 165, 233, 0.05);
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .glass-card-button:hover {
      background: #ffffff;
      transform: translateY(-4px) scale(1.015);
      border-color: #38bdf8;
      box-shadow: 0 18px 36px -10px rgba(14, 165, 233, 0.3),
                  0 0 20px 2px rgba(56, 189, 248, 0.2);
    }

    .glass-card-button:active {
      transform: translateY(0px) scale(0.99);
    }

    .text-sky-gradient {
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 50%, #0369a1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Mobile-only refinements: preserve desktop layout and all content */
    @media (max-width: 639px) {
      html { -webkit-text-size-adjust: 100%; }
      body { width: 100%; min-width: 0; }
      header { padding: 22px 16px 10px !important; }
      header > div:first-of-type { width: 100%; max-width: 360px; gap: clamp(10px, 4vw, 20px) !important; margin-bottom: 18px !important; }
      header > div:first-of-type > .group { flex: 1 1 0; min-width: 0; }
      header > div:first-of-type > .group > div { width: min(100%, 140px) !important; height: 136px !important; margin-inline: auto; }
      header > div:first-of-type img { width: 100%; height: 100%; object-fit: contain; }
      header > div:first-of-type > .h-14 { flex: 0 0 2px; }
      header h1 { font-size: clamp(19px, 5.5vw, 25px); line-height: 1.65; margin-bottom: 8px; overflow-wrap: anywhere; }
      header p { font-size: 13px; line-height: 1.9; }
      main { width: 100%; max-width: 460px; padding: 12px 16px 20px !important; }
      main .glass-card-button { min-height: 78px; padding: 12px 14px !important; gap: 8px; border-radius: 18px; }
      main .glass-card-button > div:first-child { gap: 12px; min-width: 0; }
      main .glass-card-button > div:first-child > div:first-child { width: 48px; height: 48px; flex: 0 0 48px; }
      main .glass-card-button .text-right { min-width: 0; }
      main .glass-card-button .text-lg { font-size: 16px; }
      main .glass-card-button .text-xs { font-size: 11px; line-height: 1.7; }
      main .glass-card-button > div:last-child { flex-shrink: 0; }
      footer { padding: 14px 16px 22px !important; line-height: 1.8; }
      .sky-orb { max-width: 100vw; }
    }
    @media (max-width: 360px) {
      header > div:first-of-type > .group > div { height: 112px !important; }
      main .glass-card-button { padding: 11px 10px !important; }
      main .glass-card-button > div:first-child { gap: 9px; }
    }
  </style>
</head>

  </div>

  <script>
    function copyPageLink() {
      const dummy = document.createElement('input');
      dummy.value = window.location.href;
      document.body.appendChild(dummy);
      dummy.select();
      try {
        document.execCommand('copy');
        const toast = document.getElementById('toastMessage');
        const btnText = document.getElementById('copyBtnText');

        btnText.innerText = 'هاتە کۆپیکرن ✓';
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');

        setTimeout(() => {
          toast.classList.add('opacity-0', 'pointer-events-none');
          toast.classList.remove('opacity-100');
          btnText.innerText = 'کۆپیکردنا لینکێ لاپەڕی';
        }, 2200);
      } catch (err) {
        console.error(err);
      }
      document.body.removeChild(dummy);
    }
  </script>
